services:
  # greeter בעברית, עונה Shalom בפורט 9001
  greeter-he:
    build:
      context: ../../02-docker-basics/homework/greeter
    environment:
      GREETING: Shalom
    ports:
      - "9001:8000"

  # greeter באנגלית, עונה Hello בפורט 9002
  greeter-en:
    build:
      context: ../../02-docker-basics/homework/greeter
    environment:
      GREETING: Hello
    ports:
      - "9002:8000"
